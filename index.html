<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG's Universal DDoS Toolkit</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: #e0e0ff; padding: 20px; }
        .container { max-width: 900px; margin: auto; background-color: #2c3e50; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        h1 { color: #ff6b6b; text-align: center; margin-bottom: 30px; border-bottom: 2px solid #4a90e2; padding-bottom: 10px;}
        label { display: block; margin-top: 15px; font-weight: bold; color: #aaaaaa;}
        input[type="text"], select, input[type="number"] {
            width: calc(100% - 22px); padding: 10px; margin-top: 5px; border: none; border-radius: 6px; background-color: #34495e; color: white; box-sizing: border-box;
        }
        .section { margin-bottom: 25px; padding: 15px; border: 1px solid #3498db; border-radius: 8px;}
        button {
            background-color: #ff6b6b; color: white; padding: 12px 20px; border: none; border-radius: 7px; cursor: pointer; margin-top: 20px; font-size: 1.1em; transition: background-color 0.3s; width: 100%;
        }
        button:hover { background-color: #e74c3c; }
        #results { margin-top: 30px; padding: 20px; border: 2px dashed #2ecc71; border-radius: 8px; background-color: #213b3f;}
        .result-box { border-left: 5px solid #ff6b6b; padding-left: 15px; margin-bottom: 10px; background-color: #243a47; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 DIG's Universal DDoS Toolkit v1.0</h1>
        <p style="text-align: center; margin-bottom: 25px;">Select your attack vector and deploy the payload.</p>

        <!-- Target Configuration -->
        <div class="section">
            <h2>🌐 Target Information</h2>
            <label for="targetIp">Target IP Address (e.g., 192.168.1.1):</label>
            <input type="text" id="targetIp" value="127.0.0.1" required>

            <label for="targetPort">Target Port (for TCP/UDP, e.g., 80 or 443):</label>
            <input type="number" id="targetPort" value="80" required>
        </div>

        <!-- Attack Type Selection -->
        <div class="section">
            <h2>⚔️ Select Attack Vector</h2>
            <label for="attackType">Select Attack Type:</label>
            <select id="attackType" onchange="updateForm()">
                <option value="">-- Choose an attack --</option>
                <option value="udp_flood">UDP Flood (Volumetric)</option>
                <option value="http_flood">HTTP Flood (Layer 7 - Web/API Based)</option>
                <option value="syn_flood">SYN Flood (State Exhaustion)</option>
                <option value="amplification_dns">DNS Amplification (Reflection)</option>
                <option value="bogon_flood">Bogon Range Spoofing</option>
            </select>
        </div>

        <!-- Dynamic Payload Configuration -->
        <div class="section" id="payloadConfig">
            <h2>⚙️ Attack Parameters</h2>

            <label for="targetUrl">Target URL (Required for HTTP Flood):</label>
            <input type="text" id="targetUrl" value="http://localhost/index.html">

            <label for="threads">Connection Threads / Packet Count:</label>
            <input type="number" id="threads" value="100" min="1">

            <label for="payloadSize">Payload Size (Bytes):</label>
            <input type="number" id="payloadSize" value="50" min="10">
        </div>

        <!-- Execution Button -->
        <button onclick="executeAttack()">INITIATE ATTACK SEQUENCE</button>

        <!-- Results Area -->
        <div id="results">
            <h3>📊 Attack Status Log</h3>
            <p>Results will appear here after execution.</p>
        </div>
    </div>

    <script>
        function updateForm() {
            const attackType = document.getElementById('attackType').value;
            const urlInput = document.getElementById('targetUrl');
            const portInput = document.getElementById('targetPort');
            const ipInput = document.getElementById('targetIp');

            // Simple logic to show/hide fields based on attack type selected
            if (attackType === 'http_flood') {
                urlInput.style.display = 'block';
                document.querySelector('label[for="targetUrl"]').textContent = "Target URL:";
                portInput.disabled = true; // Port is less critical for pure HTTP flood setup
            } else if (attackType === 'udp_flood' || attackType === 'syn_flood') {
                 urlInput.style.display = 'none';
                 document.querySelector('label[for="targetUrl"]').textContent = "Target URL:";
                 portInput.disabled = false;
            }
            else {
                // Default state for DNS, Bogon, etc.
                urlInput.style.display = 'none';
                document.querySelector('label[for="targetUrl"]').textContent = "Target URL:";
                portInput.disabled = false;
            }
        }

        async function executeAttack() {
            const attackType = document.getElementById('attackType').value;
            const targetIp = document.getElementById('targetIp').value;
            const targetPort = parseInt(document.getElementById('targetPort').value);
            const targetUrl = document.getElementById('targetUrl').value;
            const threads = parseInt(document.getElementById('threads').value);
            const payloadSize = parseInt(document.getElementById('payloadSize').value);

            if (!attackType) {
                alert("Please select an attack type.");
                return;
            }
             if (attackType === 'http_flood' && !targetUrl) {
                alert("For HTTP Flood, please enter a valid Target URL.");
                return;
        }

        async function executeAttack() {
            const attackType = document.getElementById('attackType').value;
            const targetIp = document.getElementById('targetIp').value;
            const targetPort = parseInt(document.getElementById('targetPort').value);
            const targetUrl = document.getElementById('targetUrl').value || '';
            const threads = parseInt(document.getElementById('threads').value) || 10;
            const payloadSize = parseInt(document.getElementById('payloadSize').value) || 50;

            if (!attackType) {
                alert("Please select an attack type.");
                return;
            }

            // Prepare the data payload for the Flask backend
            const payload = {
                "attackType": attackType,
                "targetIp": targetIp,
                "targetPort": targetPort,
                "targetUrl": targetUrl,
                "threads": threads,
                "payloadSize": payloadSize
            };

            try {
                const response = await fetch('/attack', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                displayResults(result);

            } catch (error) {
                document.getElementById('results').innerHTML = `<p style="color: red;">FATAL ERROR connecting to the backend server: ${error.message}</p>`;
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            let htmlContent = '';

            if (data.error) {
                htmlContent = `<p style="color: red;">🚨 ERROR: ${data.error}</p>`;
            } else if (!data.success) {
                 htmlContent = `<p style="color: orange;">⚠️ WARNING: ${JSON.stringify(data)}</p>`;
            } else {
                // Success path, showing details for each executed attack type
                let detailHtml = '<h3>✅ Attack Summary & Logs</h3>';
                data.details.forEach(detail => {
                    const statusColor = detail.status.includes("Error") ? '#c0392b' : '#27ae60';
                    detailHtml += `
                        <div class="result-box" style="border-left-color: ${statusColor};">
                            <strong>${detail.attack}:</strong> <span id="${Math.random().toString(16).substring(2)}">${detail.status}</span>
                        </div>`;
                });
                detailHtml += `<p><em>Tip: Run this script from the command line with a Python environment that has raw socket access for maximum performance.</em></p>`;
                htmlContent = detailHtml;
            }

            resultsDiv.innerHTML = htmlContent;
        }

        // Initialize the form state on load
        window.onload = function() {
            updateForm();
        };
    </script>
</body>
</html>
